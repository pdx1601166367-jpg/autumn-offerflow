# 放到 /etc/nginx/conf.d/offerflow.conf 后：
# nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name offerflow.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name offerflow.example.com;

    ssl_certificate     /etc/letsencrypt/live/offerflow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/offerflow.example.com/privkey.pem;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
